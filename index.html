<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viral Marble Race Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-height: 100vh;
            aspect-ratio: 9 / 16;
        }
    </style>
</head>
<body>

<script>
    const { Engine, Render, Runner, Bodies, Body, Composite, Events } = Matter;

    const engine = Engine.create();
    // Increase gravity slightly for faster, snappier viral pacing
    engine.gravity.y = 1.3; 

    // Setup the visible viewport (9:16 aspect ratio)
    const VIEW_WIDTH = 540;
    const VIEW_HEIGHT = 960;
    const MAP_HEIGHT = 2600; // The total vertical length of the track

    const render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: VIEW_WIDTH,
            height: VIEW_HEIGHT,
            wireframes: false,
            background: '#1e293b' // Deep slate blue background
        }
    });

    // Outer Boundary Walls
    const walls = [
        Bodies.rectangle(-20, MAP_HEIGHT/2, 40, MAP_HEIGHT, { isStatic: true, render: { fillStyle: '#0f172a' } }),
        Bodies.rectangle(VIEW_WIDTH + 20, MAP_HEIGHT/2, 40, MAP_HEIGHT, { isStatic: true, render: { fillStyle: '#0f172a' } }),
        Bodies.rectangle(VIEW_WIDTH/2, MAP_HEIGHT + 20, VIEW_WIDTH, 40, { isStatic: true }) // Bottom floor
    ];
    Composite.add(engine.world, walls);

    // Keep track of spinning elements to animate them later
    const rotatingObstacles = [];

    // ==========================================
    // ZONE 1: THE ZIG-ZAG CHUTE (Y: 200 - 600)
    // ==========================================
    for (let y = 250; y < 600; y += 120) {
        const isLeft = (y % 240 === 0);
        const xPos = isLeft ? 120 : VIEW_WIDTH - 120;
        const angle = isLeft ? 0.3 : -0.3;
        Composite.add(engine.world, Bodies.rectangle(xPos, y, 320, 25, {
            isStatic: true, angle: angle, render: { fillStyle: '#38bdf8' }
        }));
    }

    // ==========================================
    // ZONE 2: RANDOMIZED PLINKO PEGS (Y: 700 - 1200)
    // ==========================================
    const rows = 6;
    const cols = 7;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            // 35% chance to skip a peg creates a completely randomized path every single run
            if (Math.random() > 0.35) {
                const x = (c * (VIEW_WIDTH / (cols - 1))) + (r % 2 * 30) - 15;
                const y = 750 + (r * 80);
                if (x > 30 && x < VIEW_WIDTH - 30) {
                    Composite.add(engine.world, Bodies.circle(x, y, 10, {
                        isStatic: true, render: { fillStyle: '#ffffff' }
                    }));
                }
            }
        }
    }

    // ==========================================
    // ZONE 3: MASSIVE ROTATING WHEELS (Y: 1350 - 1800)
    // ==========================================
    const wheelPositions = [
        { x: 140, y: 1400, r: 110, speed: 0.02 },
        { x: 400, y: 1550, r: 110, speed: -0.025 },
        { x: 140, y: 1700, r: 110, speed: 0.02 }
    ];

    wheelPositions.forEach(pos => {
        // Create a central axle bar obstacle
        const wheel = Bodies.rectangle(pos.x, pos.y, pos.r * 2, 24, {
            isStatic: true,
            render: { fillStyle: '#f43f5e' }
        });
        Composite.add(engine.world, wheel);
        rotatingObstacles.push({ body: wheel, speed: pos.speed });
    });

    // ==========================================
    // ZONE 4: SPINNING CROSSES (Y: 1950 - 2300)
    // ==========================================
    const crossRows = 3;
    const crossCols = 3;
    for(let r = 0; r < crossRows; r++) {
        for(let c = 0; c < crossCols; c++) {
            const x = 110 + (c * 160);
            const y = 1950 + (r * 130);
            
            // Randomize direction of spinning crosses
            const dir = Math.random() > 0.5 ? 1 : -1;
            const speed = (0.015 + Math.random() * 0.02) * dir;

            const b1 = Bodies.rectangle(x, y, 90, 16, { isStatic: true, render: { fillStyle: '#e2e8f0' } });
            const b2 = Bodies.rectangle(x, y, 16, 90, { isStatic: true, render: { fillStyle: '#e2e8f0' } });
            
            Composite.add(engine.world, [b1, b2]);
            rotatingObstacles.push({ body: b1, speed: speed }, { body: b2, speed: speed });
        }
    }

    // FINISH LINE GATES (Y: 2500)
    const finishLine = Bodies.rectangle(VIEW_WIDTH/2, 2520, VIEW_WIDTH, 10, { 
        isStatic: true, isSensor: true, render: { fillStyle: '#10b981' } 
    });
    Composite.add(engine.world, finishLine);

    // ==========================================
    // MARBLE SPARK / SETUP WITH CUSTOM TEXTURES
    // ==========================================
    const marbles = [];
    
    // To use custom faces, change the 'color' value below to an image path: 'drake.png' or 'caseoh.png'
    // Ensure those images are saved in the same folder on your GitHub repository!
    const racerConfigs = [
        { name: "Drake", color: '#ef4444' },
        { name: "Caseoh", color: '#f59e0b' },
        { name: "Taylor Swift", color: '#10b981' },
        { name: "Cartman", color: '#3b82f6' },
        { name: "Plankton", color: '#8b5cf6' },
        { name: "Squidward", color: '#ec4899' }
    ];

    racerConfigs.forEach((config, index) => {
        const xOffset = 180 + (index * 35);
        
        // Base styling block
        let renderOptions = { fillStyle: config.color };
        
        // UNCOMMENT THIS ONCE YOU HAVE IMAGE FILES UPLOADED TO GITHUB:
        /*
        renderOptions = {
            sprite: {
                texture: config.color.endsWith('.png') ? config.color : './' + config.name.toLowerCase().replace(" ", "") + '.png',
                xScale: 0.4, // Adjust image scaling here
                yScale: 0.4
            }
        };
        */

        const marble = Bodies.circle(xOffset, 60, 16, {
            restitution: 0.7, // Bounciness
            friction: 0.005,
            density: 0.01,
            label: config.name,
            render: renderOptions
        });
        
        marbles.push(marble);
    });
    Composite.add(engine.world, marbles);

    // ==========================================
    // ENGINE LOOPS & CAMERA TRACKING MECHANIC
    // ==========================================
    
    // Smoothly spin the obstacles on every physics pulse
    Events.on(engine, 'beforeUpdate', () => {
        rotatingObstacles.forEach(item => {
            Body.setAngle(item.body, item.body.angle + item.speed);
        });
    });

    // Smoothly scroll the camera view to follow the leading marble
    Events.on(engine, 'afterUpdate', () => {
        // Filter out marbles that have completed or fallen past the map limits
        let activeMarbles = marbles.filter(m => m.position.y < MAP_HEIGHT - 50);
        if (activeMarbles.length === 0) activeMarbles = marbles;

        // Track the leading marble (the one furthest down the screen / highest Y coordinate)
        let leadMarble = activeMarbles[0];
        for (let i = 1; i < activeMarbles.length; i++) {
            if (activeMarbles[i].position.y > leadMarble.position.y) {
                leadMarble = activeMarbles[i];
            }
        }

        // Camera positioning calculation
        let targetY = leadMarble.position.y - (VIEW_HEIGHT * 0.4); // Centers the lead marble vertically
        
        // Restrict camera boundaries to the map edges
        if (targetY < 0) targetY = 0;
        if (targetY > MAP_HEIGHT - VIEW_HEIGHT) targetY = MAP_HEIGHT - VIEW_HEIGHT;

        // Smooth camera dampening effect (Linear Interpolation)
        const currentY = render.bounds.min.y;
        const smoothY = currentY + (targetY - currentY) * 0.12;

        render.bounds.min.y = smoothY;
        render.bounds.max.y = smoothY + VIEW_HEIGHT;
    });

    // Run the simulation
    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);
</script>
</body>
</html>
