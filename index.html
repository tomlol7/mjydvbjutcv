<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Underground Radio — 2D Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    :root {
      --bg: #0b0d10;
      --panel: rgba(15, 18, 23, 0.92);
      --panel-strong: rgba(9, 12, 16, 0.97);
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.17);
      --text: #f4f7fb;
      --muted: #8b96a6;
      --accent: #36f38a;
      --accent-soft: rgba(54,243,138,.12);
      --danger: #ff6575;
      --map-bg: #d9dee5;
      --shadow: 0 18px 60px rgba(0,0,0,.42);
    }

    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    #map {
      position: fixed;
      inset: 0;
      background: var(--map-bg);
      z-index: 1;
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: 0 10px 28px rgba(0,0,0,.25) !important;
    }
    .leaflet-control-zoom a {
      width: 40px !important;
      height: 40px !important;
      line-height: 38px !important;
      background: rgba(15,18,23,.94) !important;
      color: #fff !important;
      border: 1px solid rgba(255,255,255,.10) !important;
      border-bottom: 0 !important;
    }
    .leaflet-control-zoom a:last-child { border-bottom: 1px solid rgba(255,255,255,.10) !important; }
    .leaflet-control-zoom a:hover { background: #1a2028 !important; }
    .leaflet-control-attribution {
      background: rgba(9,12,16,.78) !important;
      color: #adb6c3 !important;
      font-size: 10px !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: #d7dee8 !important; }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #topbar {
      position: fixed;
      z-index: 1000;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 9px 13px;
      border-radius: 14px;
      white-space: nowrap;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 20px rgba(54,243,138,.8);
      flex: 0 0 auto;
    }
    #brand strong {
      display: block;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    #brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    #searchWrap {
      position: relative;
      pointer-events: auto;
      flex: 1;
      max-width: 760px;
      min-width: 220px;
    }
    #search {
      width: 100%;
      min-height: 48px;
      padding: 0 16px 0 42px;
      border-radius: 14px;
      border: 1px solid var(--line);
      outline: none;
      color: var(--text);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    #search:focus { border-color: rgba(54,243,138,.42); }
    #search::placeholder { color: #737e8e; }
    #searchIcon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #8590a0;
      pointer-events: none;
      font-size: 17px;
    }

    #topActions { display:flex; gap:7px; pointer-events:auto; }
    .action-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      min-height: 44px;
      padding: 0 13px;
      box-shadow: var(--shadow);
      transition: .18s ease;
    }
    .action-btn:hover { border-color: rgba(54,243,138,.35); transform: translateY(-1px); }

    #sidebar {
      position: fixed;
      z-index: 1000;
      top: 78px;
      left: 16px;
      width: 370px;
      max-height: calc(100vh - 180px);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #stats {
      display:flex;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted);
    }
    #stats strong { color: var(--text); font-size: 12px; }
    #loadProgress { color: var(--accent); }

    #filters {
      padding: 10px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }
    .field {
      min-width: 0;
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 11px;
      background:rgba(255,255,255,.035);
      color:var(--text);
      outline:none;
    }
    .field:focus { border-color: rgba(54,243,138,.4); }
    .field option { background:#10141a; }

    #mapTools {
      display:flex;
      gap:7px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .tool-btn {
      flex:1;
      border:1px solid var(--line);
      background:rgba(255,255,255,.035);
      color:#dfe6ef;
      border-radius:10px;
      padding:9px 10px;
      font-size:11px;
      font-weight:700;
    }
    .tool-btn:hover { border-color:rgba(54,243,138,.35); }
    .tool-btn.accent { color:var(--accent); background:var(--accent-soft); border-color:rgba(54,243,138,.20); }

    #stationHeader {
      padding: 11px 13px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      color:var(--muted);
      font-size:11px;
    }
    #stationHeader strong { color:var(--text); }

    #stationList {
      overflow:auto;
      padding:7px;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.16) transparent;
    }
    .station-item {
      width:100%;
      display:grid;
      grid-template-columns:42px 1fr auto;
      gap:9px;
      align-items:center;
      text-align:left;
      border:1px solid transparent;
      border-radius:12px;
      background:transparent;
      color:var(--text);
      padding:9px;
      margin-bottom:4px;
    }
    .station-item:hover { background:rgba(255,255,255,.04); border-color:var(--line); }
    .station-item.active { background:var(--accent-soft); border-color:rgba(54,243,138,.22); }
    .station-logo {
      width:42px;
      height:42px;
      object-fit:cover;
      border-radius:10px;
      border:1px solid var(--line);
      background:#11161d;
    }
    .station-main { min-width:0; }
    .station-name {
      display:block;
      font-size:13px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .station-sub {
      display:block;
      margin-top:3px;
      font-size:10px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .station-heart {
      border:0;
      background:transparent;
      color:#6b7584;
      font-size:17px;
      padding:4px;
    }
    .station-heart.saved { color:var(--danger); }

    #loadMore {
      margin: 0 8px 8px;
      width: calc(100% - 16px);
      border:1px solid rgba(54,243,138,.20);
      background:var(--accent-soft);
      color:var(--accent);
      border-radius:11px;
      padding:10px;
      font-size:11px;
      font-weight:800;
    }
    #loadMore:disabled { opacity:.5; cursor:wait; }

    #player {
      position:fixed;
      z-index:1000;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      width:min(980px, calc(100vw - 32px));
      min-height:70px;
      display:grid;
      grid-template-columns:52px 1fr auto;
      align-items:center;
      gap:12px;
      padding:10px 12px;
      border-radius:18px;
    }
    #nowArt {
      width:52px;
      height:52px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid var(--line);
      background:#11161d;
    }
    #nowText { min-width:0; }
    #stationName {
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #stationMeta {
      margin-top:4px;
      color:var(--muted);
      font-size:10px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #playerControls { display:flex; gap:7px; align-items:center; }
    #playerControls button {
      width:39px;
      height:39px;
      border-radius:10px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.035);
      color:var(--text);
    }
    #playBtn {
      background:var(--accent) !important;
      color:#06150c !important;
      font-weight:900;
    }
    #favBtn.saved { color:var(--danger); }
    #audio { display:none; }

    #loading {
      position:fixed;
      z-index:1100;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      border-radius:14px;
      padding:14px 16px;
      font-size:12px;
      display:none;
    }
    .spinner {
      display:inline-block;
      width:13px;
      height:13px;
      margin-right:8px;
      vertical-align:-2px;
      border:2px solid rgba(255,255,255,.15);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    #toast {
      position:fixed;
      z-index:1200;
      left:50%;
      top:77px;
      transform:translateX(-50%) translateY(-8px);
      opacity:0;
      pointer-events:none;
      border-radius:10px;
      padding:10px 13px;
      font-size:11px;
      transition:.2s ease;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    .station-popup {
      min-width: 210px;
      max-width: 280px;
      color: #111;
    }
    .station-popup strong {
      display:block;
      font-size:13px;
      margin-bottom:4px;
    }
    .station-popup span {
      display:block;
      color:#5f6873;
      font-size:11px;
      margin-bottom:9px;
    }
    .station-popup button {
      width:100%;
      border:0;
      background:#0d1117;
      color:#fff;
      padding:8px 10px;
      border-radius:8px;
      font-size:11px;
      font-weight:800;
    }

    @media (max-width: 900px) {
      #topbar { left:10px; right:10px; top:10px; }
      #brand { display:none; }
      #topActions { display:none; }
      #sidebar {
        left:10px;
        right:10px;
        width:auto;
        top:68px;
        max-height:38vh;
      }
      #player {
        left:10px;
        right:10px;
        bottom:10px;
        width:auto;
        transform:none;
      }
      #playerControls button:nth-child(1), #playerControls button:nth-child(3) { display:none; }
    }
    @media (max-width: 520px) {
      #sidebar { max-height:34vh; }
      #filters { grid-template-columns:1fr; }
      #player { grid-template-columns:46px 1fr auto; }
      #nowArt { width:46px; height:46px; }
      #stationName { font-size:12px; }
      #playerControls button { width:36px; height:36px; }
      #playerControls { gap:4px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="topbar">
    <div id="brand" class="glass">
      <span class="brand-dot"></span>
      <div>
        <strong>Global Underground Radio</strong>
        <span>20,000 live stations · interactive world map</span>
      </div>
    </div>

    <div id="searchWrap">
      <span id="searchIcon">⌕</span>
      <input id="search" autocomplete="off" placeholder="Search station, city, country, language, genre..." />
    </div>

    <div id="topActions">
      <button class="action-btn" id="randomBtn">Random</button>
      <button class="action-btn" id="favoritesBtn">Favorites</button>
    </div>
  </div>

  <aside id="sidebar" class="glass">
    <div id="stats">
      <div><strong id="resultCount">0</strong> matching</div>
      <div id="loadProgress">0 / 20,000</div>
    </div>

    <div id="filters">
      <select id="countryFilter" class="field"><option value="">All countries</option></select>
      <select id="genreFilter" class="field"><option value="">All genres</option></select>
    </div>

    <div id="mapTools">
      <button class="tool-btn" id="worldBtn">World</button>
      <button class="tool-btn" id="myCountryBtn">Zoom out</button>
      <button class="tool-btn accent" id="mapStyleBtn">Map style</button>
    </div>

    <div id="stationHeader">
      <div><strong id="listCount">0</strong> shown in list</div>
      <div>20,000 target</div>
    </div>

    <div id="stationList"></div>
    <button id="loadMore">Load more stations</button>
  </aside>

  <div id="player" class="glass">
    <img id="nowArt" alt="" />
    <div id="nowText">
      <div id="stationName">Click a green station dot</div>
      <div id="stationMeta">Nothing playing</div>
    </div>
    <div id="playerControls">
      <button id="prevBtn" title="Previous">◀</button>
      <button id="playBtn" title="Play / pause">▶</button>
      <button id="nextBtn" title="Next">▶</button>
      <button id="favBtn" title="Favorite">♡</button>
    </div>
  </div>

  <div id="loading" class="glass">
    <span class="spinner"></span><span id="loadingText">Loading stations…</span>
  </div>

  <div id="toast" class="glass"></div>

  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
    const API_MIRRORS = [
      'https://de1.api.radio-browser.info',
      'https://nl1.api.radio-browser.info'
    ];

    // Radio-Browser supports offset/limit paging. We intentionally load in chunks so the
    // browser does not request one giant JSON payload all at once.
    const TARGET_STATIONS = 20000;
    const CHUNK_SIZE = 5000;
    const LIST_LIMIT = 180;

    const state = {
      stations: [],
      byId: new Map(),
      filtered: [],
      selected: null,
      loadedOffset: 0,
      moreAvailable: true,
      loadingMore: false,
      showFavoritesOnly: false,
      favorites: new Set(JSON.parse(localStorage.getItem('gur_favorites_v2') || '[]')),
      activeApi: API_MIRRORS[0],
      map: null,
      pointLayer: null,
      pointById: new Map(),
      lightMap: true
    };

    const audio = document.getElementById('audio');
    const search = document.getElementById('search');
    const countryFilter = document.getElementById('countryFilter');
    const genreFilter = document.getElementById('genreFilter');
    const stationList = document.getElementById('stationList');
    const resultCount = document.getElementById('resultCount');
    const listCount = document.getElementById('listCount');
    const loadProgress = document.getElementById('loadProgress');
    const loadMore = document.getElementById('loadMore');
    const stationName = document.getElementById('stationName');
    const stationMeta = document.getElementById('stationMeta');
    const nowArt = document.getElementById('nowArt');
    const playBtn = document.getElementById('playBtn');
    const favBtn = document.getElementById('favBtn');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const toastEl = document.getElementById('toast');

    const LIGHT_TILES = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    const DARK_TILES = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
    const lightTiles = L.tileLayer(LIGHT_TILES, {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });
    const darkTiles = L.tileLayer(DARK_TILES, {
      maxZoom: 20,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    });

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
      }[c]));
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function showLoading(message) {
      loadingText.textContent = message;
      loading.style.display = 'block';
    }

    function hideLoading() {
      loading.style.display = 'none';
    }

    function fallbackArt(station) {
      const text = encodeURIComponent((station.name || 'RADIO').slice(0, 12));
      return `https://dummyimage.com/96x96/11161d/36f38a&text=${text}`;
    }

    function normalizeStation(raw) {
      const lat = Number(raw.geo_lat);
      const lng = Number(raw.geo_long);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      if (!raw.stationuuid || !raw.url_resolved) return null;

      return {
        id: raw.stationuuid,
        name: (raw.name || 'Unnamed station').trim(),
        url: raw.url_resolved,
        homepage: raw.homepage || '',
        favicon: raw.favicon || '',
        country: (raw.country || 'Unknown').trim(),
        code: (raw.countrycode || '').trim(),
        state: (raw.state || '').trim(),
        language: (raw.language || '').trim(),
        tags: (raw.tags || '').trim(),
        codec: raw.codec || '',
        bitrate: Number(raw.bitrate) || 0,
        clicks: Number(raw.clickcount) || 0,
        lat,
        lng
      };
    }

    async function fetchWithMirror(path) {
      let lastError = null;
      for (const base of API_MIRRORS) {
        try {
          const response = await fetch(base + path, { cache: 'no-store' });
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          state.activeApi = base;
          return await response.json();
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('Radio-Browser unavailable');
    }

    async function loadChunk() {
      if (state.loadingMore || !state.moreAvailable) return;
      if (state.stations.length >= TARGET_STATIONS) {
        state.moreAvailable = false;
        refreshLoadButton();
        return;
      }

      state.loadingMore = true;
      refreshLoadButton();
      const offset = state.loadedOffset;
      const limit = Math.min(CHUNK_SIZE, TARGET_STATIONS - state.stations.length);

      showLoading(`Loading stations ${offset.toLocaleString()}–${(offset + limit).toLocaleString()}…`);

      try {
        const query = new URLSearchParams({
          has_geo_info: 'true',
          hidebroken: 'true',
          order: 'name',
          reverse: 'false',
          offset: String(offset),
          limit: String(limit)
        });

        const data = await fetchWithMirror('/json/stations/search?' + query.toString());
        let added = 0;

        for (const raw of data) {
          const station = normalizeStation(raw);
          if (!station || state.byId.has(station.id)) continue;
          state.byId.set(station.id, station);
          state.stations.push(station);
          added++;
        }

        state.loadedOffset += limit;
        if (data.length < limit || state.stations.length >= TARGET_STATIONS) state.moreAvailable = false;

        rebuildFilters();
        applyFilters();
        refreshLoadButton();
        hideLoading();

        if (!added && data.length) toast('This batch contained no new mappable stations.');
      } catch (error) {
        console.error(error);
        hideLoading();
        toast('Radio-Browser could not be reached. Try Load more again.');
      } finally {
        state.loadingMore = false;
        refreshLoadButton();
      }
    }

    async function loadInitial() {
      showLoading('Loading 20,000 stations…');
      for (let i = 0; i < TARGET_STATIONS / CHUNK_SIZE; i++) {
        if (!state.moreAvailable) break;
        await loadChunk();
      }
      hideLoading();
    }

    function refreshLoadButton() {
      loadProgress.textContent = `${state.stations.length.toLocaleString()} / ${TARGET_STATIONS.toLocaleString()}`;
      if (state.loadingMore) {
        loadMore.disabled = true;
        loadMore.textContent = 'Loading…';
      } else if (!state.moreAvailable) {
        loadMore.disabled = true;
        loadMore.textContent = `${state.stations.length.toLocaleString()} stations loaded`;
      } else {
        loadMore.disabled = false;
        loadMore.textContent = `Load more · ${state.stations.length.toLocaleString()} loaded`;
      }
    }

    function rebuildFilters() {
      const currentCountry = countryFilter.value;
      const currentGenre = genreFilter.value;

      const countries = new Map();
      const genres = new Map();

      for (const station of state.stations) {
        const countryKey = station.code || station.country;
        if (countryKey && !countries.has(countryKey)) countries.set(countryKey, station.country);
        for (const tag of station.tags.split(',').map(x => x.trim().toLowerCase()).filter(Boolean)) {
          if (tag.length < 2 || tag.length > 30) continue;
          genres.set(tag, (genres.get(tag) || 0) + 1);
        }
      }

      const countryOptions = [...countries.entries()].sort((a,b) => a[1].localeCompare(b[1]));
      countryFilter.innerHTML = '<option value="">All countries</option>' + countryOptions.map(([code, name]) =>
        `<option value="${escapeHTML(code)}">${escapeHTML(name)} (${escapeHTML(code)})</option>`).join('');

      const genreOptions = [...genres.entries()].sort((a,b) => b[1] - a[1]).slice(0, 100);
      genreFilter.innerHTML = '<option value="">All genres</option>' + genreOptions.map(([tag, count]) =>
        `<option value="${escapeHTML(tag)}">${escapeHTML(tag)} (${count.toLocaleString()})</option>`).join('');

      if ([...countryFilter.options].some(o => o.value === currentCountry)) countryFilter.value = currentCountry;
      if ([...genreFilter.options].some(o => o.value === currentGenre)) genreFilter.value = currentGenre;
    }

    function applyFilters() {
      const q = search.value.trim().toLowerCase();
      const country = countryFilter.value;
      const genre = genreFilter.value;

      state.filtered = state.stations.filter(station => {
        if (state.showFavoritesOnly && !state.favorites.has(station.id)) return false;
        if (country && station.code !== country) return false;
        if (genre && !station.tags.toLowerCase().split(',').map(x => x.trim()).includes(genre)) return false;
        if (!q) return true;
        const haystack = [station.name, station.country, station.code, station.state, station.language, station.tags].join(' ').toLowerCase();
        return haystack.includes(q);
      });

      resultCount.textContent = state.filtered.length.toLocaleString();
      renderStationList();
      renderMapPoints();
    }

    function renderStationList() {
      const visible = state.filtered.slice(0, LIST_LIMIT);
      listCount.textContent = visible.length.toLocaleString();

      if (!visible.length) {
        stationList.innerHTML = '<div style="padding:22px;text-align:center;color:var(--muted);font-size:11px">No stations match your filters.</div>';
        return;
      }

      stationList.innerHTML = visible.map(station => `
        <button class="station-item ${state.selected?.id === station.id ? 'active' : ''}" data-id="${escapeHTML(station.id)}">
          <img class="station-logo" src="${escapeHTML(station.favicon || fallbackArt(station))}" alt="" loading="lazy"
               onerror="this.onerror=null;this.src='${fallbackArt(station)}'">
          <span class="station-main">
            <span class="station-name">${escapeHTML(station.name)}</span>
            <span class="station-sub">${escapeHTML(station.country)}${station.state ? ' · ' + escapeHTML(station.state) : ''}${station.tags ? ' · ' + escapeHTML(station.tags.split(',')[0]) : ''}</span>
          </span>
          <span class="station-heart ${state.favorites.has(station.id) ? 'saved' : ''}" data-fav="${escapeHTML(station.id)}">
            ${state.favorites.has(station.id) ? '♥' : '♡'}
          </span>
        </button>
      `).join('');

      stationList.querySelectorAll('.station-item').forEach(button => {
        button.addEventListener('click', event => {
          const fav = event.target.closest('[data-fav]');
          if (fav) {
            event.stopPropagation();
            toggleFavorite(fav.dataset.fav);
            return;
          }
          const station = state.byId.get(button.dataset.id);
          if (station) tune(station, true);
        });
      });
    }

    function saveFavorites() {
      localStorage.setItem('gur_favorites_v2', JSON.stringify([...state.favorites]));
    }

    function toggleFavorite(id) {
      if (state.favorites.has(id)) state.favorites.delete(id);
      else state.favorites.add(id);
      saveFavorites();
      updateFavoriteButton();
      renderStationList();
    }

    function updateFavoriteButton() {
      const saved = state.selected && state.favorites.has(state.selected.id);
      favBtn.textContent = saved ? '♥' : '♡';
      favBtn.classList.toggle('saved', !!saved);
    }

    async function tune(station, centerMap = true) {
      if (!station) return;
      state.selected = station;
      stationName.textContent = station.name;
      stationMeta.textContent = `${station.country}${station.state ? ', ' + station.state : ''} · ${station.codec || 'stream'}${station.bitrate ? ' · ' + station.bitrate + ' kbps' : ''}`;
      nowArt.src = station.favicon || fallbackArt(station);
      updateFavoriteButton();
      renderStationList();
      renderMapPoints();

      if (centerMap) {
        state.map.flyTo([station.lat, station.lng], Math.max(state.map.getZoom(), 6), { duration: .8 });
      }

      // Radio-Browser's URL endpoint is used when the station starts playing so the click is recorded.
      try {
        const response = await fetchWithMirror('/json/url/' + encodeURIComponent(station.id));
        if (response?.url) station.url = response.url;
      } catch (_) {}

      try {
        audio.src = station.url;
        await audio.play();
        playBtn.textContent = 'Ⅱ';
      } catch (error) {
        console.error(error);
        playBtn.textContent = '▶';
        toast('This station could not be played in this browser.');
      }
    }

    function moveSelection(direction) {
      if (!state.filtered.length) return;
      const index = state.selected ? state.filtered.findIndex(s => s.id === state.selected.id) : -1;
      const next = index < 0 ? 0 : (index + direction + state.filtered.length) % state.filtered.length;
      tune(state.filtered[next], true);
    }

    function tuneRandom() {
      if (!state.filtered.length) return toast('No stations in the current filter.');
      tune(state.filtered[Math.floor(Math.random() * state.filtered.length)], true);
    }

    function stationColor(station) {
      if (state.selected?.id === station.id) return '#ffffff';
      return '#23eb7d';
    }

    function renderMapPoints() {
      if (!state.map) return;
      if (state.pointLayer) state.pointLayer.clearLayers();
      state.pointById.clear();

      // Canvas rendering keeps thousands of station dots much lighter than thousands of SVG/DOM nodes.
      const stations = state.filtered;
      const radius = state.map.getZoom() >= 6 ? 3 : 2.2;

      for (const station of stations) {
        const marker = L.circleMarker([station.lat, station.lng], {
          renderer: canvasRenderer,
          radius,
          color: stationColor(station),
          weight: state.selected?.id === station.id ? 2 : 0.5,
          fillColor: stationColor(station),
          fillOpacity: state.selected?.id === station.id ? 1 : .86,
          opacity: .95,
          bubblingMouseEvents: false
        });

        marker.on('click', event => {
          L.DomEvent.stopPropagation(event);
          tune(station, false);
          const popup = L.popup({ closeButton:true, offset:[0,-4], className:'gur-popup' })
            .setLatLng([station.lat, station.lng])
            .setContent(`
              <div class="station-popup">
                <strong>${escapeHTML(station.name)}</strong>
                <span>${escapeHTML(station.country)}${station.state ? ', ' + escapeHTML(station.state) : ''}${station.tags ? ' · ' + escapeHTML(station.tags.split(',')[0]) : ''}</span>
                <button id="popupTune">Play station</button>
              </div>`)
            .openOn(state.map);
          setTimeout(() => document.getElementById('popupTune')?.addEventListener('click', () => tune(station, false)), 0);
        });

        marker.bindTooltip(`${escapeHTML(station.name)}<br><span style="color:#7e8998">${escapeHTML(station.country)}</span>`, { direction:'top', sticky:true, opacity:.95 });
        state.pointLayer.addLayer(marker);
        state.pointById.set(station.id, marker);
      }
    }

    const canvasRenderer = L.canvas({ padding: .4 });

    function initMap() {
      state.map = L.map('map', {
        preferCanvas: true,
        worldCopyJump: true,
        zoomControl: true,
        minZoom: 2,
        maxZoom: 18,
        zoomSnap: .25,
        zoomDelta: .5
      }).setView([24, 7], 2.25);

      lightTiles.addTo(state.map);
      state.pointLayer = L.layerGroup().addTo(state.map);

      state.map.on('zoomend', () => renderMapPoints());
      state.map.on('moveend', () => {
        // Nothing expensive here; Leaflet only redraws the canvas.
      });
    }

    function toggleMapStyle() {
      if (state.lightMap) {
        state.map.removeLayer(lightTiles);
        darkTiles.addTo(state.map);
        state.lightMap = false;
        toast('Dark map enabled');
      } else {
        state.map.removeLayer(darkTiles);
        lightTiles.addTo(state.map);
        state.lightMap = true;
        toast('Light map enabled');
      }
    }

    function resetWorld() {
      state.map.flyTo([24, 7], 2.25, { duration: .7 });
    }

    search.addEventListener('input', () => {
      clearTimeout(search.timer);
      search.timer = setTimeout(applyFilters, 120);
    });
    countryFilter.addEventListener('change', applyFilters);
    genreFilter.addEventListener('change', applyFilters);
    loadMore.addEventListener('click', loadChunk);
    document.getElementById('worldBtn').addEventListener('click', resetWorld);
    document.getElementById('myCountryBtn').addEventListener('click', () => state.map.setZoom(Math.max(2, state.map.getZoom() - 2)));
    document.getElementById('mapStyleBtn').addEventListener('click', toggleMapStyle);
    document.getElementById('randomBtn').addEventListener('click', tuneRandom);
    document.getElementById('favoritesBtn').addEventListener('click', () => {
      state.showFavoritesOnly = !state.showFavoritesOnly;
      document.getElementById('favoritesBtn').textContent = state.showFavoritesOnly ? 'All stations' : 'Favorites';
      applyFilters();
      toast(state.showFavoritesOnly ? 'Favorites filter on' : 'Showing all stations');
    });

    playBtn.addEventListener('click', async () => {
      if (!audio.src) return toast('Pick a station first.');
      try {
        if (audio.paused) {
          await audio.play();
          playBtn.textContent = 'Ⅱ';
        } else {
          audio.pause();
          playBtn.textContent = '▶';
        }
      } catch (_) { toast('Playback was blocked by the browser.'); }
    });
    favBtn.addEventListener('click', () => state.selected && toggleFavorite(state.selected.id));
    document.getElementById('prevBtn').addEventListener('click', () => moveSelection(-1));
    document.getElementById('nextBtn').addEventListener('click', () => moveSelection(1));

    audio.addEventListener('playing', () => playBtn.textContent = 'Ⅱ');
    audio.addEventListener('pause', () => playBtn.textContent = '▶');
    audio.addEventListener('error', () => {
      playBtn.textContent = '▶';
      toast('Stream error or unsupported format.');
    });

    window.addEventListener('keydown', event => {
      if (event.target.matches('input,select')) return;
      if (event.code === 'Space') {
        event.preventDefault();
        playBtn.click();
      } else if (event.key === 'ArrowLeft') {
        moveSelection(-1);
      } else if (event.key === 'ArrowRight') {
        moveSelection(1);
      } else if (event.key.toLowerCase() === 'r') {
        tuneRandom();
      }
    });

    initMap();
    refreshLoadButton();
    loadInitial();
  </script>
</body>
</html>
